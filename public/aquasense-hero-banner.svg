<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b7de9" />
      <stop offset="45%" stop-color="#0b4f9c" />
      <stop offset="100%" stop-color="#052c65" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="tankBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="glassPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.38" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#021024" flood-opacity="0.45" />
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Main Sky & Tech Wave Background -->
  <rect width="1400" height="760" fill="url(#bgSky)" />
  <circle cx="180" cy="140" r="320" fill="#60a5fa" opacity="0.22" />
  <path d="M 0 650 Q 260 610 420 700 L 0 760 Z" fill="#38bdf8" opacity="0.18" />
  <path d="M 1050 180 Q 1260 90 1400 160 L 1400 390 Q 1220 310 1050 180 Z" fill="#38bdf8" opacity="0.16" />

  <!-- Top Header Lockup: Droplet + AquaSense + Subtitle -->
  <g transform="translate(640, 28)">
    <!-- Water Drop Icon -->
    <path d="M 26 4 C 26 4 0 38 0 56 C 0 71 11.6 82 26 82 C 40.4 82 52 71 52 56 C 52 38 26 4 26 4 Z" fill="url(#dropGrad)" />
    <path d="M 14 52 C 12 62 18 71 26 73" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    <!-- Brand Text -->
    <text x="68" y="66" font-family="Outfit, Plus Jakarta Sans, sans-serif" font-size="60" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Aqua<tspan fill="#67e8f9">Sense</tspan>
    </text>
    <!-- Wi-Fi Waves above Sense -->
    <path d="M 432 22 A 16 16 0 0 1 452 28" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" />
    <path d="M 426 12 A 28 28 0 0 1 462 22" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" />
    <path d="M 420 2 A 40 40 0 0 1 472 15" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" />
  </g>

  <text x="865" y="132" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="25" font-weight="600" fill="#f0f9ff">
    Smart Tank Monitoring &amp; Device API QA Suite
  </text>

  <!-- Subtitle Capsule -->
  <g transform="translate(604, 150)">
    <rect x="0" y="0" width="526" height="34" rx="17" fill="#0c4a6e" fill-opacity="0.65" stroke="#7dd3fc" stroke-opacity="0.6" stroke-width="1.2" />
    <text x="263" y="22" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="15.5" font-weight="600" fill="#e0f2fe">
      Nivoryx Systems Private Limited   |   Technical Assignment
    </text>
  </g>

  <!-- LEFT SIDE: Outdoor Rooftop Smart Water Tank + Cutaway + IoT Sensor -->
  <g transform="translate(0, 48)">
    <!-- Concrete Rooftop Ledge -->
    <polygon points="0,255 360,248 410,275 410,712 0,712" fill="#94a3b8" opacity="0.45" />
    <polygon points="0,245 365,240 410,262 0,272" fill="#cbd5e1" />

    <!-- Plumbing Pipe on Left of Tank -->
    <path d="M 65 245 L 65 65 L 105 65" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 20 220 L 82 220" fill="none" stroke="#64748b" stroke-width="9" />

    <!-- Cylindrical White Water Tank -->
    <g transform="translate(76, 40)" filter="url(#softShadow)">
      <!-- Top Dome & Lid -->
      <rect x="78" y="0" width="56" height="16" rx="4" fill="#1e293b" />
      <ellipse cx="106" cy="28" rx="98" ry="18" fill="#f8fafc" />
      <!-- Tank Body -->
      <rect x="8" y="28" width="196" height="178" rx="14" fill="url(#tankBody)" />
      <!-- Ribbed Horizontal Rings -->
      <line x1="8" y1="62" x2="204" y2="62" stroke="#cbd5e1" stroke-width="3" />
      <line x1="8" y1="175" x2="204" y2="175" stroke="#cbd5e1" stroke-width="3" />
      <ellipse cx="106" cy="206" rx="98" ry="12" fill="#cbd5e1" />

      <!-- Cutaway Window Revealing Glowing Water -->
      <rect x="64" y="54" width="114" height="132" rx="10" fill="#0f172a" fill-opacity="0.78" stroke="#94a3b8" stroke-width="3" />
      <!-- Water Fill (55%) -->
      <rect x="67" y="106" width="108" height="77" rx="6" fill="url(#waterGrad)" />
      <ellipse cx="121" cy="106" rx="54" ry="8" fill="#7dd3fc" opacity="0.85" />
    </g>

    <!-- IoT Ultrasonic Wi-Fi Sensor Node -->
    <g transform="translate(68, 224)">
      <rect x="0" y="0" width="54" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
      <circle cx="27" cy="22" r="4" fill="#0284c7" />
      <!-- Blue Wi-Fi Badge Above Sensor -->
      <circle cx="25" cy="-22" r="18" fill="#0284c7" stroke="#ffffff" stroke-width="2.5" />
      <path d="M 15 -20 A 14 14 0 0 1 35 -20" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 19 -15 A 8 8 0 0 1 31 -15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="25" cy="-10" r="2.2" fill="#ffffff" />
    </g>

    <!-- 5 Feature Capsules on Left -->
    <g transform="translate(38, 305)">
      <!-- 1 -->
      <g transform="translate(0, 0)">
        <rect width="346" height="54" rx="22" fill="url(#glassPill)" stroke="#bae6fd" stroke-opacity="0.75" stroke-width="1.5" />
        <text x="84" y="33" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Real-Time Tank Dashboard</text>
        <circle cx="44" cy="27" r="16" fill="#0284c7" fill-opacity="0.5" stroke="#ffffff" stroke-width="1.8" />
        <path d="M 36 31 L 52 31 A 6 6 0 0 0 52 21 A 8 8 0 0 0 38 19 A 5 5 0 0 0 36 31 Z" fill="none" stroke="#ffffff" stroke-width="1.8" />
      </g>
      <!-- 2 -->
      <g transform="translate(0, 68)">
        <rect width="346" height="54" rx="22" fill="url(#glassPill)" stroke="#bae6fd" stroke-opacity="0.75" stroke-width="1.5" />
        <text x="84" y="33" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="600" fill="#ffffff">&lt; 20% Low-Level Alerting</text>
        <path d="M 44 15 C 38 15 35 20 35 26 L 35 32 L 32 35 L 56 35 L 53 32 L 53 26 C 53 20 50 15 44 15 Z" fill="none" stroke="#ffffff" stroke-width="2" />
      </g>
      <!-- 3 -->
      <g transform="translate(0, 136)">
        <rect width="346" height="54" rx="22" fill="url(#glassPill)" stroke="#bae6fd" stroke-opacity="0.75" stroke-width="1.5" />
        <text x="84" y="33" font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Device API Test Plan &amp; Automation</text>
        <text x="44" y="33" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#ffffff">&lt;/&gt;</text>
      </g>
      <!-- 4 -->
      <g transform="translate(0, 204)">
        <rect width="346" height="54" rx="22" fill="url(#glassPill)" stroke="#bae6fd" stroke-opacity="0.75" stroke-width="1.5" />
        <text x="84" y="33" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Mobile Wi-Fi Drop Strategy</text>
        <rect x="37" y="14" width="14" height="25" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
      </g>
      <!-- 5 -->
      <g transform="translate(0, 272)">
        <rect width="346" height="54" rx="22" fill="url(#glassPill)" stroke="#bae6fd" stroke-opacity="0.75" stroke-width="1.5" />
        <text x="84" y="33" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="600" fill="#ffffff">AI-Assisted Development</text>
        <rect x="35" y="17" width="18" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
        <text x="44" y="30" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" fill="#ffffff">AI</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: Laptop Mockup Displaying AquaSense Dashboard -->
  <g transform="translate(410, 198)" filter="url(#softShadow)">
    <!-- Laptop Lid Bezel -->
    <rect x="0" y="0" width="940" height="515" rx="26" fill="#1e293b" stroke="#475569" stroke-width="3" />
    <rect x="18" y="18" width="904" height="478" rx="10" fill="#f1f5f9" />
    <circle cx="470" cy="10" r="3" fill="#64748b" />

    <!-- Sidebar Inside Screen -->
    <path d="M 18 28 Q 18 18 28 18 L 166 18 L 166 496 L 28 496 Q 18 496 18 486 Z" fill="#072146" />
    <!-- Sidebar Brand -->
    <path d="M 42 42 C 42 42 33 54 33 60 C 33 65 37 69 42 69 C 47 69 51 65 51 60 C 51 54 42 42 42 42 Z" fill="#38bdf8" />
    <text x="57" y="62" font-family="Outfit, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
      Aqua<tspan fill="#38bdf8">Sense</tspan>
    </text>

    <!-- Sidebar Nav Items -->
    <rect x="26" y="88" width="130" height="32" rx="8" fill="#1d6ce0" />
    <text x="58" y="109" font-family="Plus Jakarta Sans, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Dashboard</text>
    <text x="58" y="149" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#cbd5e1">Telemetry</text>
    <text x="58" y="187" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#cbd5e1">API Testing</text>
    <text x="58" y="225" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#cbd5e1">AI Note</text>
    <text x="58" y="263" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#cbd5e1">Wi-Fi Strategy</text>

    <!-- Screen Main Area -->
    <g transform="translate(184, 34)">
      <!-- Header Row -->
      <text x="0" y="20" font-family="Outfit, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Tank Level Dashboard</text>
      <rect x="206" y="4" width="52" height="22" rx="11" fill="#dcfce7" />
      <circle cx="218" cy="15" r="3.5" fill="#16a34a" />
      <text x="226" y="19" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">Live</text>

      <text x="562" y="19" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#334155">TANK-01  |  10,000 L</text>

      <!-- 3 Metric Cards -->
      <!-- Card 1: Current Tank Level 55% -->
      <g transform="translate(0, 42)" filter="url(#cardShadow)">
        <rect width="248" height="134" rx="12" fill="#ffffff" stroke="#e2e8f0" />
        <circle cx="34" cy="36" r="18" fill="#e0f2fe" />
        <path d="M 34 25 C 34 25 26 36 26 41 C 26 45 29.5 49 34 49 C 38.5 49 42 45 42 41 C 42 36 34 25 34 25 Z" fill="#0284c7" />
        <text x="64" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Current Tank Level</text>
        <text x="64" y="68" font-family="Outfit, sans-serif" font-size="34" font-weight="800" fill="#0f172a">55%</text>
        <text x="64" y="92" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#15803d">▲ +13% <tspan fill="#475569" font-weight="500">(vs 18:00)</tspan></text>
        <rect x="64" y="102" width="118" height="22" rx="11" fill="#dcfce7" />
        <text x="123" y="117" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#15803d">NORMAL RANGE</text>
      </g>

      <!-- Card 2: Today's Minimum 18% -->
      <g transform="translate(262, 42)" filter="url(#cardShadow)">
        <rect width="224" height="134" rx="12" fill="#ffffff" stroke="#e2e8f0" />
        <circle cx="32" cy="36" r="18" fill="#fee2e2" />
        <text x="32" y="42" text-anchor="middle" font-size="16" font-weight="800" fill="#dc2626">↓</text>
        <text x="58" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Today&apos;s Minimum</text>
        <text x="58" y="68" font-family="Outfit, sans-serif" font-size="34" font-weight="800" fill="#dc2626">18%</text>
        <rect x="58" y="78" width="116" height="22" rx="10" fill="#fee2e2" />
        <text x="116" y="93" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c">Breached &lt; 20%</text>
        <text x="64" y="116" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#334155">16:00</text>
      </g>

      <!-- Card 3: Today's Maximum 78% -->
      <g transform="translate(500, 42)" filter="url(#cardShadow)">
        <rect width="218" height="134" rx="12" fill="#ffffff" stroke="#e2e8f0" />
        <circle cx="32" cy="36" r="18" fill="#e0f2fe" />
        <text x="32" y="42" text-anchor="middle" font-size="16" font-weight="800" fill="#0284c7">↗</text>
        <text x="58" y="30" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Today&apos;s Maximum</text>
        <text x="58" y="68" font-family="Outfit, sans-serif" font-size="34" font-weight="800" fill="#0f172a">78%</text>
        <rect x="58" y="78" width="96" height="22" rx="10" fill="#e0f2fe" />
        <text x="106" y="93" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="600" fill="#0369a1">Morning Peak</text>
        <text x="64" y="116" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#334155">06:00</text>
      </g>

      <!-- Bottom Row: Tank Visualization + 24-Hour Tank Level Curve -->
      <g transform="translate(0, 190)" filter="url(#cardShadow)">
        <rect width="304" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0" />
        <text x="18" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Tank Visualization</text>

        <!-- Illustrated Cylinder -->
        <rect x="50" y="54" width="134" height="138" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
        <rect x="52" y="112" width="130" height="78" rx="12" fill="url(#waterGrad)" />
        <ellipse cx="117" cy="112" rx="65" ry="9" fill="#38bdf8" />
        <text x="117" y="148" text-anchor="middle" font-family="Outfit, sans-serif" font-size="23" font-weight="800" fill="#ffffff">55%</text>
        <text x="117" y="168" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="600" fill="#e0f2fe">5,500 L</text>

        <!-- 20% Red Dashed Line -->
        <line x1="40" y1="168" x2="220" y2="168" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" />
        <text x="224" y="172" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#dc2626">20% ALERT</text>
      </g>

      <!-- 24-Hour Tank Level Curve Card -->
      <g transform="translate(318, 190)" filter="url(#cardShadow)">
        <rect width="400" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0" />
        <text x="18" y="26" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" fill="#0f172a">24-Hour Tank Level Curve</text>

        <!-- Grid lines -->
        <line x1="46" y1="48" x2="380" y2="48" stroke="#f1f5f9" />
        <line x1="46" y1="76" x2="380" y2="76" stroke="#f1f5f9" />
        <line x1="46" y1="104" x2="380" y2="104" stroke="#f1f5f9" />
        <line x1="46" y1="132" x2="380" y2="132" stroke="#f1f5f9" />
        <line x1="46" y1="160" x2="380" y2="160" stroke="#e2e8f0" />

        <text x="38" y="52" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">100%</text>
        <text x="38" y="80" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">80%</text>
        <text x="38" y="108" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">60%</text>
        <text x="38" y="136" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">40%</text>
        <text x="38" y="162" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">20%</text>

        <!-- Curve Polygon & Line -->
        <polygon points="58,78 102,94 146,108 190,124 234,139 278,148 322,120 368,104 368,174 58,174" fill="#38bdf8" fill-opacity="0.18" />
        <polyline points="58,78 102,94 146,108 190,124 234,139 278,148 322,120 368,104" fill="none" stroke="#0284c7" stroke-width="2.5" />

        <!-- Red Callout Box for 16:00 (18%) -->
        <rect x="214" y="64" width="114" height="38" rx="7" fill="#dc2626" />
        <text x="271" y="80" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Low Level: 18%</text>
        <text x="271" y="94" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" fill="#fee2e2">(Threshold Breach)</text>
        <line x1="278" y1="102" x2="278" y2="148" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" />
        <circle cx="278" cy="148" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="2" />

        <text x="58" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#475569">06:00</text>
        <text x="102" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#475569">08:00</text>
        <text x="146" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#475569">10:00</text>
        <text x="190" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#475569">12:00</text>
        <text x="234" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#475569">14:00</text>
        <text x="278" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#dc2626">16:00</text>
        <text x="322" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#475569">18:00</text>
        <text x="368" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#475569">20:00</text>
      </g>

      <!-- Bottom Historical Alert Strip inside Laptop Screen -->
      <g transform="translate(0, 412)">
        <rect width="718" height="36" rx="8" fill="#fee2e2" stroke="#fca5a5" />
        <text x="52" y="23" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" fill="#991b1b">
          Historical Alert: <tspan font-weight="500">Tank level dropped to </tspan>18% at 16:00, <tspan font-weight="500">below the 20% reserve threshold.</tspan>
        </text>
      </g>
    </g>

    <!-- Laptop Base Lip -->
    <rect x="-70" y="510" width="1080" height="22" rx="8" fill="#94a3b8" />
    <rect x="390" y="510" width="160" height="8" rx="4" fill="#475569" />
  </g>
</svg>
